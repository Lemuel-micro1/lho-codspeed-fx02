name: CodSpeed benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test and benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check correctness
        run: python -m pytest -q
      - name: Measure CPU performance
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: python -m pytest tests/benchmarks --codspeed
